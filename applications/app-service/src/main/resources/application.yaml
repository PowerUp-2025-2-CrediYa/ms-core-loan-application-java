server:
  port: 8081
spring:
  application:
    name: "ms-core-loan-application-java"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    tasks: "/api/v1/solicitud"

adapters:
  r2dbc:
    host: "172.17.7.189"
    port: 5433
    database: "loandb"
    schema: "loan"
    username: "root"
    password: "root"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
